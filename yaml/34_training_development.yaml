  "39_soldier_family_wellness": risk assessment counseling and wellness programs
flow:
  - step: 1
    name: Classify
    action: Sort into training management (plan, execute, record, assess), institutional courses, unit programs (mandatory training, certification, ATP), or leader development.
  - step: 2
    name: USAREC policy
    action: "Read UR 350-1 Ch.1 for policy and processes; for responsibilities, courses, mandatory training, certification and ATP read the matching chapter from the PDF and cite paragraph numbers from the PDF."
    sources:
      - UR_350-1 1-8
      - UR_350-1 1-10
      - UR_350-1
  - step: 3
    name: Station and company role
    action: Add the station commander's training role from UM 3-31 Ch.5 and company expectations from UM 3-30 Ch.1.
    sources:
      - UM_3-31 Ch.5
      - UM_3-30 Ch.1
  - step: 4
    name: Records and forms
    action: Name the system of record (DTMS) and the UF 350-1 forms the regulation requires, quoting where each is kept.
    sources:
      - UR_350-1 1-10
  - step: 5
    name: Army doctrine
    action: When the question is how to plan or run training, use FM 7-0 (training management cycle, planning horizons, AARs, evaluation) and AR 350-1 for the Army training system and NCOPDS.
    sources:
      - FM_7-0 Ch.1
      - FM_7-0 Ch.3
      - FM_7-0 Ch.4
      - AR_350-1 1-12
      - AR_350-1 3-31
  - step: 6
    name: Tasks and standards
    action: For 79R task standards, cite STP 805K-79R-SMTG by task title and note its edition date.
    sources:
      - STP805K-79R-SMTG
  - step: 7
    name: Answer
    action: Return requirements, who is responsible, forms and records, citations, and state where the text is PDF-only.
example_questions:
  - "What has to go on my station's near-term training plan, and where is it posted?"
  - "How do I record individual training done outside the training schedule?"
  - "What does the Advanced Training Program require me to do with a new recruiter?"
  - "How is the order of merit list used for recruiting courses?"
  - "What is a CSTAR and who prepares it?"
  - "How does the 79R Leader Development Program work at station level?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "UR 350-1 chapters 2 to 4 and its appendixes are PDF-only; read them, never reconstruct them from memory."
  - "Do not list UF 350-1.7 as current; the UR 350-1 summary of change says it was rescinded."
provenance:
  doctrine_root: doctrine
  paths: "relative to doctrine_root; 'markdown' is a repo-relative path to the pre-split doctrine text; load it directly at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
