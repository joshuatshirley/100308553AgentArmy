flow:
  - step: 1
    name: Identify path
    action: "Chaplain or chaplain candidate; RA or AR; prior service or not. Screen prior service with the REDD message."
  - step: 2
    name: Qualifications
    action: "Read DoDI 1304.28 Section 3 for capability, educational and application requirements and the Chaplain Candidate Program; quote them."
    sources:
      - DoDI_1304.28
  - step: 3
    name: Endorsement
    action: "Explain the endorsement requirement and DD Form 2088 from DoDI 1304.28 Sections 3 and 4; use DoDI 5120.08 for the Armed Forces Chaplains Board role."
    sources:
      - DoDI_1304.28
      - DoDI_5120.08
  - step: 4
    name: Reserve appointment
    action: For Reserve applicants, apply AR 135-100 3-5 to 3-9 for special requirements, grade, applications and verification of qualifications.
    sources:
      - AR_135-100 3-5
      - AR_135-100 3-6
      - AR_135-100 3-7
      - AR_135-100 3-8
      - AR_135-100 3-9
  - step: 5
    name: USAREC processing
    action: Read UR 601-108 in the PDF for the application process, medical processing, waivers, Senior Army Chaplain interview and board packet. If the PDF cannot be read, say so and stop rather than inferring.
    sources:
      - UR_601-108
  - step: 6
    name: Physical and waivers
    action: Confirm the commissioning physical requirement before boarding (message 23-022) and the DMPM conduct waiver routing (message 22-060), quoting Requirement lines.
    sources:
      - AR_135-100 1-8
  - step: 7
    name: Return
    action: Return the path, citations, open facts, PDF-only caveats and hand-offs.
example_questions:
  - "What does someone in seminary need to become a chaplain candidate?"
  - "How does ecclesiastical endorsement work, and who provides the DD Form 2088?"
  - "My chaplain applicant served enlisted in the Marines years ago. What screening do I need?"
  - "Does a chaplain applicant need a physical completed before the board?"
  - "Who approves a conduct waiver for a chaplain applicant?"
  - "What goes in a chaplain board packet?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "When quoting a USAREC message, quote only its Subject line and 'Requirement:' lines (or the PDF). The consolidated message file also contains generated summary paragraphs that contain errors; never cite those."
  - "UR 601-108 is PDF-only in this library; never describe its procedures from memory."
  - "Never evaluate or comment on an applicant's religion or faith group; endorsement is the religious organization's decision."
