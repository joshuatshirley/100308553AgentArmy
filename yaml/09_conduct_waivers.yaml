clarifying_questions:
  - "Is the applicant non-prior service, prior service or glossary NPS?"
  - "Which component: Regular Army or Army Reserve?"
  - "For each offense: what was the charge, what was the final disposition, and when? Was the applicant a juvenile or adult at the time?"
  - "Are any charges still pending, or is the applicant on probation or other civil restraint now?"
  - "What court or police documents do you already have?"
hand_off_to:
  "07_medical_standards": any medical disqualification or medical waiver (AR 601-210 4-5)
  "10_drug_alcohol": positive drug or alcohol test, DAT waiver, marijuana-use questions not tied to a civil conviction
  "11_appearance_accommodation": tattoos, brands, religious accommodation
  "04_dependents_family": dependents waivers (4-19) and surviving son or daughter (4-20)
  "13_prior_service": prior military service disqualifications (4-13, 4-23, 4-24) and RE codes
  "12_background_security": SF 86 answers, tech check results, NACLC/secret clearance outcomes
  "41_policy_currency": "every answer: confirm no newer message changes approval authority or offense handling"
flow:
  - step: 1
    name: Confirm applicant type
    action: Ask the clarifying questions that are unknown. If prior service, hand off to 13_prior_service for eligibility and come back only for waiver mechanics.
  - step: 2
    name: List offenses
    action: Build a list of each offense with charge, disposition, date and juvenile/adult status. Never ask for names, case numbers or other PII.
  - step: 3
    name: Check nonwaiverable first
    action: "Read AR 601-210 Section II (4-22 to 4-24). If any item applies, stop: state that it is nonwaiverable, cite it, and point to 4-34 only if an HQDA exception could apply."
    sources:
      - AR_601-210 4-22
      - AR_601-210 4-23
      - AR_601-210 4-24
      - AR_601-210 4-34
  - step: 4
    name: Classify each offense
    action: "Find each offense in tables 4-1 to 4-4 (paras 4-8 to 4-11) and use the court disposition definitions (4-12) and evaluation guidelines (4-4). Quote the table row; do not classify from memory."
    sources:
      - AR_601-210 4-4
      - AR_601-210 4-6
      - AR_601-210 4-7
      - AR_601-210 4-8
      - AR_601-210 4-9
      - AR_601-210 4-10
      - AR_601-210 4-11
      - AR_601-210 4-12
  - step: 5
    name: Determine whether a waiver is needed
    action: Apply the conduct standards and processing rules to the classified list to decide whether a conduct waiver is required.
    sources:
      - AR_601-210 4-2
      - AR_601-210 4-29
      - AR_601-210 4-30
  - step: 6
    name: Timing and restraint
    action: Check waiting periods, pending charges or civil restraint, and unsupervised probation. If a timing rule blocks processing, say when processing can resume as the text states.
    sources:
      - AR_601-210 4-31
      - AR_601-210 4-33
      - AR_601-210 4-35
  - step: 7
    name: Authority
    action: Identify the approval and disapproval authority from the regulation, then ask 41_policy_currency about delegation messages (for example the marijuana/DUI delegation message) before stating who approves.
    sources:
      - AR_601-210 4-26
      - AR_601-210 4-28
  - step: 8
    name: Build the packet
    action: List required investigations and supporting documents from the regulation and the USAREC procedure, naming the forms in this seed.
    sources:
      - AR_601-210 4-3
      - AR_601-210 4-32
      - UR_601-210 15-3
      - UR_601-210 15-6
  - step: 9
    name: Counsel and route
    action: Give the recruiter the counseling points and USAREC-level review or exception-to-policy route when the text calls for one.
    sources:
      - UR_601-210 15-5
      - UR_601-210 15-8
      - UR_601-210 15-9
  - step: 10
    name: Validity and reporting
    action: State the waiver validity period and reporting requirements as written.
    sources:
      - AR_601-210 4-27
      - AR_601-210 4-36
  - step: 11
    name: Return
    action: "Return to the orchestrator: determination path (not a decision), citations per step, forms, open facts, and any hand-offs."
example_questions:
  - "My applicant has two speeding tickets and one failure-to-appear from last year. Does that need a waiver?"
  - "Is a juvenile adjudication that was sealed still something I have to report and evaluate?"
  - "Who approves a conduct waiver for a DUI conviction, and has that changed recently?"
  - "My applicant is still on unsupervised probation. Can I keep processing?"
  - "Which offenses make an applicant nonwaiverable?"
  - "What documents do I need in the packet for a misdemeanor conviction?"
  - "Do I need a police record check for every place the applicant has lived?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - Never tell the recruiter or applicant to leave an offense off any form (see message 25-029, owned by 12_background_security).
  - Output is a determination path with citations, not an approval.
