flow:
  - step: 1
    name: Classify
    action: Decide whether the question is DEP rules, sustainment and training, promotion, inventory and follow-up, extension or renegotiation, or shipping. Send separations to 26_dep_separations.
  - step: 2
    name: DEP rules
    action: Read the DEP authority, eligibility, terms of service and processing paragraphs that apply.
    sources:
      - AR_601-210 5-28
      - AR_601-210 5-29
      - AR_601-210 5-30
      - AR_601-210 5-31
      - AR_601-210 5-32
  - step: 3
    name: Extensions and changes
    action: "For an extension, read the authorized situations and who may approve; for a disqualification during DEP, read the special provisions. Note UR Ch.10 renegotiation procedures are PDF only."
    sources:
      - AR_601-210 5-33
      - AR_601-210 5-34
      - UR_601-210 Ch.10
  - step: 4
    name: Orientation and sustainment
    action: List the orientation topics and the sustainment and PT safety requirements, naming the forms in this seed.
    sources:
      - UR_601-210 17-2
      - UR_601-210 17-3
      - UR_601-210 17-4
      - UR_601-210 17-5
  - step: 5
    name: Follow-up and inventory
    action: "Read follow-up expectations and the FSAI requirement; check the current FSAI message for timing and upload rules."
    sources:
      - UR_601-210 17-6
      - UR_601-210 17-7
  - step: 6
    name: Training and promotion
    action: "Read Future Soldier training, the advanced-rank verification workflow and referral promotion; flag that 17-8e names a fitness test that the current message and 2-18 have replaced."
    sources:
      - UR_601-210 17-8
      - AR_601-210 5-35
      - AR_601-210 2-18
  - step: 7
    name: Functions
    action: For FSTP functions, read the funding, approval and prohibited-activity rules.
    sources:
      - UR_601-210 17-9
  - step: 8
    name: Shipping
    action: "Read the DEP-out procedures, courtesy and hometown shipping and BCT ship-date rules; check ship-location and ship-requirement messages."
    sources:
      - UR_601-210 18-3
      - UR_601-210 18-4
      - UR_601-210 18-5
      - UR_601-210 18-6
  - step: 9
    name: Station commander view
    action: When asked by a station commander, add the UM 3-31 expectations for leading Future Soldiers and preventing losses.
    sources:
      - UM_3-31 Ch.3
  - step: 10
    name: Return
    action: Return steps, who does each, forms, messages checked, citations and hand-offs.
example_questions:
  - "What has to be covered in a Future Soldier's initial orientation?"
  - "When does the company commander do the Future Soldier Asset Inventory?"
  - "My Future Soldier needs more time in the DEP to finish high school. Can we extend them?"
  - "What do I need to submit to get a Future Soldier promoted before they ship?"
  - "Can we use FS function funds for a meal at a restaurant?"
  - "What does the GC check before printing the DD 1966 on ship day?"
  - "Who can be a hometown shipper and what's on the checklist?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "Do not state DEP length, extension limits, FSAI timing or ship-day rules from memory; quote the cited paragraph."
  - "Future Soldier PT is voluntary and requires the signed statement and risk assessment in UR 601-210 17-5; never advise skipping them."
