tie_break_rules:
  - "Eligibility topic + prior service: route to 13_prior_service first, even when a topic agent (age, education, dependents, conduct) also matches; the topic agent may be consulted for the waiver mechanics only."
  - "Waiver question: the topic agent decides whether a disqualification exists; 09_conduct_waivers owns waiver mechanics (authority, submission, validity, waiting periods) except medical waivers (07_medical_standards) and drug/alcohol waivers (10_drug_alcohol)."
  - "Army Reserve applicant: add 14_army_reserve to whichever topic agent is chosen."
  - "Officer, warrant, AMEDD or chaplain applicant: route to 15, 16 or 17 before any enlisted topic agent; enlisted agents are consulted only where the officer regulation points back to AR 601-210."
  - "Any question containing 'current', 'latest', 'still', 'new', a bonus, a program, or a named USAREC message: always also query 41_policy_currency."
  - "If two specialists both claim the question after these rules, send to both and present both answers labelled by source; do not pick one silently."
conflict_rule:
  hierarchy:
    - "Level 1: AR 601-210 (core enlistment regulation)"
    - "Level 2: other Army regulations, DoD instructions, Army directives, DA pamphlets"
    - "Level 3: USAREC regulations and manuals, current USAREC messages"
    - "Level 4: guides, training products, GTAs"
  rule: "Default to the higher level. Exception to surface, not resolve: when a current USAREC message states that it changes a named paragraph (for example a message titled 'Operational Change to AR 601-210, 2-18'), present both the paragraph and the message, say which is newer, and tell the recruiter to confirm with the guidance counselor or battalion operations before acting."
  never:
    - Cite a USAREC message the catalog marks as rescinded or superseded without saying so.
sources:
  - doc: _source_catalog.json
    note: every document, edition, authority level, chapter file and paragraph heading the specialists may cite
  - doc: _usarec_message_catalog.json
    note: "155 USAREC messages with subject and currency status"
flow:
  - step: 1
    name: Intake
    action: Restate the question in one line. Strip any PII the user typed and continue with generic facts.
  - step: 2
    name: Classify
    action: Match the question against routing_table triggers. Split multi-part questions into separate parts.
  - step: 3
    name: Gather deciding facts
    action: If any fact in applicant_facts_that_decide_routing is unknown AND would change the route, ask for it (one short question per fact). Otherwise proceed and state the assumption.
  - step: 4
    name: Apply tie-break rules
    action: Pick the owning specialist(s) per tie_break_rules. Always add 41_policy_currency for time-sensitive topics.
  - step: 5
    name: Dispatch
    action: "Send each part to its specialist with the deciding facts. Specialists return: answer, citations (doc/chapter/paragraph), open questions, hand-offs."
  - step: 6
    name: Verify
    action: "Reject any specialist claim without a citation. A citation to a paragraph in _source_catalog.json counts as verified. A citation the specialist read in a PDF-only chapter (a source marked 'not transformed' or 'PDF only') is kept but labelled 'from PDF, not catalog-verified' so the recruiter checks it. Re-ask the specialist once for anything uncited; if still uncited, drop the claim and say it could not be verified."
  - step: 7
    name: Resolve conflicts
    action: Apply conflict_rule. Surface message-vs-paragraph conflicts instead of resolving them.
  - step: 8
    name: Compose
    action: "Reply in this order: bottom line; what the doctrine says with citations; what the recruiter should do next (forms, who approves); what still needs confirming."
  - step: 9
    name: No grounded owner
    action: If no specialist covers the question, say 'no grounded agent covers this yet' and name the closest documents in the library. Do not answer from general knowledge.
answer_template:
  - Bottom line (one or two sentences)
  - What the doctrine says (each point cited)
  - Next steps for the recruiter
  - Confirm before acting (open facts, possible message changes, approval authority)
example_questions:
  - "My applicant was in the Navy for two years and has a speeding ticket from last year. What do I need to do?"
  - "Is there still a bonus for 18X?"
  - "Can a Future Soldier in the Reserve change their ship date, and who approves it?"
  - "What's the difference between how we process a nurse and an enlisted medic?"
  - "How do I build my station's weekly battle rhythm?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
provenance:
  doctrine_root: doctrine
  paths: "relative to doctrine_root; 'markdown' is a repo-relative path to the pre-split doctrine text; load it directly at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
