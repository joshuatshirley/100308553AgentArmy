flow:
  - step: 1
    name: Identify the program
    action: Map the applicant to 9D, 9H, 9I, 9J, a sister-service WOC selectee, a USMA/ROTC disenrollee, or the warrant officer procurement program.
    sources:
      - AR_601-210 9-10
      - AR_601-210 9-14
      - AR_601-210 9-15
      - AR_601-210 9-16
  - step: 2
    name: DEP/DTP check
    action: Read the program paragraph for whether members of the DEP or DTP may process for OCS or WOFT and say what the text states.
    sources:
      - AR_601-210 9-10
      - AR_601-210 9-16
  - step: 3
    name: Prerequisites
    action: List the program's prerequisites (education, citizenship, service limits, age, aptitude score, medical, clearance, prior program failure or nonselection) by quoting the paragraph. Do not restate any limit from memory.
    sources:
      - AR_601-210 9-10
      - AR_601-210 9-15
  - step: 4
    name: Warrant officer procurement
    action: For warrant officer applicants, apply DA Pam 601-6 for which requirements are and are not waiverable, MOS prerequisites, and application preparation.
    sources:
      - DA_PAM_601-6 1-5
      - DA_PAM_601-6 2-3
      - DA_PAM_601-6 2-4
      - DA_PAM_601-6 2-5
  - step: 5
    name: Cadets and sister services
    action: For USMA/ROTC cadets, disenrollees or WOC selectees from sister services, follow UR 601-210 8-4 to 8-8.
    sources:
      - UR_601-210 8-4
      - UR_601-210 8-5
      - UR_601-210 8-6
      - UR_601-210 8-7
      - UR_601-210 8-8
  - step: 6
    name: Conduct and other waivers
    action: Read message 24-003 Requirement lines and UR 601-210 Ch.25 in the PDF for OCS and WOFT conduct waivers or suitability reviews and their routing. Use AR 135-100 1-7 and 1-8 and AR 350-51 for ineligibles and waivers. Only consult 09_conduct_waivers if the officer text points back to AR 601-210 Chapter 4.
    sources:
      - AR_135-100 1-7
      - AR_135-100 1-8
      - AR_350-51
  - step: 7
    name: Boards and appointment
    action: Describe selection boards, examining boards and appointment as the text states, including the Army Reserve OCS board change message.
    sources:
      - DA_PAM_601-6 2-6
      - AR_135-100 4-1
      - AR_135-100 4-2
  - step: 8
    name: Flag dated sources
    action: "Say that AR 350-51 and AR 135-100 are older editions and that UR 601-210 Ch.25 is PDF-only; recommend confirming with battalion operations."
  - step: 9
    name: Return
    action: Return the program path, prerequisites cited, waiver route, open facts and hand-offs.
example_questions:
  - "My applicant has a bachelor's degree and wants to go to OCS. What does the 9D option require?"
  - "Can a Future Soldier already in the DEP switch to the OCS option?"
  - "What does a WOFT applicant need in their packet, and which requirements can't be waived?"
  - "My OCS applicant has an old reckless driving conviction. Who handles the conduct waiver?"
  - "How do I process a cadet who was disenrolled from ROTC?"
  - "What changed for Army Reserve OCS applicants this fiscal year?"
  - "Can a sister-service member selected for warrant officer school enlist with us?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "When quoting a USAREC message, quote only its Subject line and 'Requirement:' lines (or the PDF). The consolidated message file also contains generated summary paragraphs that contain errors; never cite those."
  - "UR 601-210 Ch.25 is PDF-only; if its text cannot be read, say so and do not fill the gap from AR 601-210."
  - Output is a processing path with citations, not a selection or approval.
