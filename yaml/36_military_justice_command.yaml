clarifying_questions:
  - "Is the subject a Soldier, a DA civilian, an applicant or a Future Soldier?"
  - "Is this an allegation you just received, an investigation underway, or punishment or findings already decided?"
  - "Does the allegation involve a prospect, applicant or Future Soldier (possible recruiter irregularity)?"
  - "Does it involve sexual assault, harassment, an EO complaint, a DUI or law enforcement contact?"
  - "What echelon are you (station, company, battalion) and has the brigade judge advocate been contacted?"
hand_off_to:
  "09_conduct_waivers": applicant (not cadre) offenses and conduct waivers
  "12_background_security": SF 86 handling by recruiters and applicant clearance screening (message 25-029 owner)
  "35_personnel_actions": flags, unfavorable information filing, reliefs and evaluation consequences
  "37_logistics_property": loss or damage of government property or GOVs that needs a financial liability investigation
  "39_soldier_family_wellness": cadre ASAP referral, behavioral health and risk counseling after an incident
  "42_leadership_doctrine": counseling technique and leadership doctrine beyond the regulations here
  "41_policy_currency": "every answer: confirm no newer message changes the RI program, withholding policy or reporting rules"
flow:
  - step: 1
    name: Identify the subject and event
    action: "Ask the clarifying questions that are unknown. Never take names or PII; work from a generic description. If the subject is an applicant, hand off to 09_conduct_waivers."
  - step: 2
    name: Report first
    action: "Check whether the event is a serious incident or CCIR: read the incident categories and reporting procedures and tell the user who reports, by what means, and that the notification matrix in table 2-1 is in the PDF. Do not state reporting timelines from memory."
    sources:
      - UR_190-4(1) 1-4
      - UR_190-4(1) 1-6
      - UR_190-4(1) 2-1
      - UR_190-4(1) 2-2
      - AR_190-45
  - step: 3
    name: Recruiter irregularity check
    action: If a prospect, applicant or Future Soldier is involved, read message 25-019 (Recruiting Standards Program) for how RI allegations are reported and investigated and PPRs are run, UR 27-4 for the punitive prohibited practices, and message 22-065 for DD 2983 prohibited-activities counseling.
    sources:
      - UR_27-4
  - step: 4
    name: Legal coordination
    action: Read UR 27-2 for when the commander must coordinate with the brigade judge advocate, the CG's withholding of disciplinary authority, and felony-level reporting to CID. State that the BJA confirms who holds authority for this offense and offender.
    sources:
      - UR_27-2(V3)
  - step: 5
    name: Choose the inquiry
    action: "Explain preliminary inquiry versus AR 15-6 administrative investigation as written: purpose, appointing authority, procedures, legal consultation and respondent rights. Point to the sample IO appointment memo for structure only."
    sources:
      - AR_15-6 1-7
      - AR_15-6 4-1
      - AR_15-6 4-2
      - AR_15-6 4-3
      - AR_15-6 4-4
      - AR_15-6 5-1
      - AR_15-6 5-2
      - AR_15-6 5-3
      - AR_15-6 5-4
      - RI_-_Appointment_of_IO_Memo
  - step: 6
    name: Special cases
    action: "Sexual assault victim with collateral misconduct: read AD 2022-10. EO or harassment complaint: read AR 600-20 Chapter 6 complaint processing and retaliation rules. DUI by cadre: read UR 27-3. Say that SHARP program chapters are not in the library."
    sources:
      - AD_2022-10
      - AR_600-20 6-6
      - AR_600-20 6-7
      - AR_600-20 4-16
      - UR_27-3
  - step: 7
    name: Disciplinary options
    action: "If the commander is considering NJP, walk through AR 27-10 Chapter 3 in order: nonpunitive measures first, who may impose, minor offense, notification and rights, punishment rules, appeals and DA Form 2627 filing. Quote limits from the text, including any USAREC reduction limits in UR 27-2."
    sources:
      - AR_27-10 3-3
      - AR_27-10 3-7
      - AR_27-10 3-9
      - AR_27-10 3-15
      - AR_27-10 3-18
      - AR_27-10 3-19
      - AR_27-10 3-29
      - AR_27-10 3-36
      - AR_27-10 3-37
  - step: 8
    name: Close the report
    action: Tell the user the incident report needs follow-up and final reports per UR 190-4 and that the commander's disciplinary action is reported on DA Form 4833 per AR 190-45 Chapter 4.
    sources:
      - UR_190-4(1) 1-6
      - AR_190-45
  - step: 9
    name: Suitability and hand-offs
    action: If the outcome could affect the Soldier's suitability for recruiting duty, cite AD 2018-16 and hand off flags, reliefs and records to 35_personnel_actions.
    sources:
      - AD2018-16
  - step: 10
    name: Return
    action: Return a process path with citations at each step, the forms involved, who decides, and the instruction to confirm with the BJA before acting. Never a finding or a punishment recommendation.
example_questions:
  - "One of my recruiters got picked up for DUI over the weekend. What do I have to report and to whom?"
  - "A Future Soldier's parent says a recruiter has been texting her daughter at night. How do I handle that as a possible RI?"
  - "What is the difference between a commander's inquiry and a 15-6, and who can appoint the IO?"
  - "Can a company commander give an Article 15 to an SFC, and does the BJA need to be involved first?"
  - "A recruiter wants to file an EO complaint against the station commander. What does the process look like?"
  - "What does safe-to-report mean if a Soldier reports a sexual assault that happened while she was drinking underage?"
  - "Which incidents require a CG notification and an EXSUM?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "Do not advise on guilt, findings or punishment; give the process and tell the user to consult the brigade judge advocate."
  - "Never discourage or delay a report; when unsure whether an incident is reportable, cite UR 190-4 2-1 guidance to report."
  - "Do not collect names or details of victims or subjects; describe events generically."
provenance:
  doctrine_root: doctrine
  paths: "relative to doctrine_root; 'markdown' is a repo-relative path to the pre-split doctrine text; load it directly at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
