clarifying_questions:
  - "Is this about routine accountability (hand receipts, inventories, requests) or a loss, damage or accident?"
  - "What kind of item: GOV, IT equipment, sensitive item, furniture or expendable supplies?"
  - "If a loss: has the responsible person admitted negligence, and has the loss been reported to the property book officer?"
  - "Are you the hand-receipt holder, the station commander or the company commander?"
hand_off_to:
  "36_military_justice_command": misconduct, GOV misuse as discipline, and serious incident reports for theft or accidents
  "25_future_soldier_management": Future Soldier asset inventory and issue of FS kits to Future Soldiers
  "38_it_records_knowledge": IT equipment security, laptop or phone compromise, PII exposure
  "30_station_operations": how property and logistics fit into the station's sustaining operations and plan
  "41_policy_currency": "every answer: confirm no newer message changes logistics or GOV policy"
flow:
  - step: 1
    name: Classify
    action: Decide whether the question is routine accountability, GOV management, a loss or damage, facilities/housing, or station/TDA change.
  - step: 2
    name: Routine accountability
    action: For hand receipts, inventories, transfers, registers and supply requests, answer from UR 700-5 Chapter 2 and add the company-level CSDP expectations from UM 3-30.
    sources:
      - UR_700-5 2-2
      - UR_700-5 2-3
      - UR_700-5 2-5
      - UR_700-5 2-6
      - UR_700-5 2-7
      - UR_700-5 2-8
      - UR_700-5 2-12
      - UR_700-5 2-13
      - UM_3-30 Ch.5
  - step: 3
    name: Vehicles
    action: For GOV questions, read the matching UR 700-5 Chapter 3 paragraph (authorization, official use, domicile-to-duty, operator qualification, inspections, accidents, fuel cards, prohibited items). Quote limits and approval levels from the text only.
    sources:
      - UR_700-5 3-2
      - UR_700-5 3-4
      - UR_700-5 3-5
      - UR_700-5 3-7
      - UR_700-5 3-12
      - UR_700-5 3-16
      - UR_700-5 3-17
      - UR_700-5 3-20
  - step: 4
    name: "Loss or damage: report"
    action: Tell the user to report the loss as AR 735-5 Chapter 4 requires and check whether the event is also a serious incident (hand off to 36_military_justice_command).
    sources:
      - AR_735-5 4-1
      - AR_735-5 4-2
  - step: 5
    name: Choose the relief method
    action: Read the methods of obtaining relief, including admitted negligence and adjustment documents, and when a financial liability investigation is mandatory. Do not state dollar or time limits from memory.
    sources:
      - AR_735-5 4-4
      - AR_735-5 4-5
      - AR_735-5 4-6
      - AR_735-5 5-3
      - UR_700-5 2-9
  - step: 6
    name: Run the FLIPL
    action: If a DD Form 200 is required, explain initiation, time constraints, appointing and approving authority, and the financial liability officer's duties as written.
    sources:
      - AR_735-5 5-6
      - AR_735-5 5-7
      - AR_735-5 5-11
      - AR_735-5 5-19
      - AR_735-5 6-4
      - AR_735-5 6-7
  - step: 7
    name: Respondent rights
    action: If liability is recommended, give the respondent's rights, rebuttal, reconsideration and remission steps.
    sources:
      - AR_735-5 11-3
      - AR_735-5 11-8
      - AR_735-5 11-9
      - AR_735-5 11-13
      - AR_735-5 11-15
  - step: 8
    name: Special cases
    action: For vehicle accidents, sensitive items, keys, leased property or inventory losses, read the matching Chapter 12 paragraph.
    sources:
      - AR_735-5 12-13
      - AR_735-5 12-17
      - AR_735-5 12-22
      - AR_735-5 12-33
      - AR_735-5 12-34
      - AR_735-5 12-35
  - step: 9
    name: Facilities and station changes
    action: "For facilities, leased housing or support agreements use UR 700-5 Chapters 4 to 6; for station moves or TDA changes use UR 570-1 and note its 2006 edition date."
    sources:
      - UR_700-5 4-2
      - UR_700-5 5-3
      - UR_700-5 6-2
      - UR_570-1
  - step: 10
    name: Return
    action: Return the steps in order with citations, forms named in the text (DD Form 200 and others), who decides, and any hand-offs.
example_questions:
  - "One of my recruiters lost a government iPad. Do I need a FLIPL or can it be handled another way?"
  - "What do I have to do before I sign for the company property book at change of command?"
  - "Can a recruiter take the GOV home at night, and who approves domicile-to-duty?"
  - "A recruiter backed the GOV into a pole at a school. What reports and investigations are required?"
  - "How do sub-hand receipts work for station equipment?"
  - "What is the process to relocate a recruiting station?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - Output is a process path with citations, not a liability determination.
provenance:
  doctrine_root: doctrine
  paths: "relative to doctrine_root; 'markdown' is a repo-relative path to the pre-split doctrine text; load it directly at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
