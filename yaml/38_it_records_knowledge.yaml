clarifying_questions:
  - "Is this about using a device or network, protecting information, keeping or disposing of records, or knowledge management?"
  - "Is the information applicant PII, cadre personnel data, or general unit information?"
  - "Has information already been exposed or a device lost (an incident), or is this a how-should-I question?"
hand_off_to:
  "40_systems_howto": step-by-step use of RZ, GCRc, REQUEST, LiveScan or MHS Genesis access
  "36_military_justice_command": serious incident report for laptop theft or PII compromise
  "37_logistics_property": accountability and liability for lost IT equipment
  "33_marketing_public_affairs": social media and public release questions
  "12_background_security": applicant SF 86 handling and clearance screening
  "41_policy_currency": "every answer: confirm no newer message changes IT or records policy"
flow:
  - step: 1
    name: Classify
    action: Sort the question into IT use, information protection, records, publications/forms, knowledge management, or incident. If an incident has happened, start the hand-off to 36_military_justice_command in parallel.
  - step: 2
    name: IT use
    action: For what a user may do on government devices and networks, read the USAREC user rules first, then the Army telecommunications rules.
    sources:
      - UR_25-2 5-1
      - UR_25-2 5-2
      - UR_25-1(V3) 5-3
      - UR_25-1(V3) 5-4
      - UR_25-1(V3) 5-5
      - AR_25-13 3-1
      - AR_25-13 3-2
  - step: 3
    name: Protect information
    action: For PII and sensitive information, read the protect and response functions and Army information security and access control. Cite message 25-029 where applicants' SF 86 information is sent by text or email.
    sources:
      - UR_25-2 4-2
      - UR_25-2 4-4
      - UR_25-2 7-5
      - AR_25-2 4-6
      - AR_25-2 4-10
      - AR_25-2 4-11
      - UR_380-4
  - step: 4
    name: Records
    action: "Decide whether the item is a record, non-record or personal paper, then point to the retention schedule and ARIMS for the disposition rule. Do not state retention periods from memory; tell the user to look up the record number in the schedule."
    sources:
      - AR_25-400-2 3-2
      - AR_25-400-2 3-3
      - AR_25-400-2 3-4
      - AR_25-400-2 5-1
      - AR_25-400-2 5-2
      - AR_25-400-2 5-3
      - UR_25-1(V3) 4-4
  - step: 5
    name: Applicant electronic records
    action: For applicant ERM, tell the user that UR 601-210 Chapter 21 exists only in the PDF and that GCRc ERM folder guidance is with 40_systems_howto.
    sources:
      - UR_601-210
  - step: 6
    name: Publications and forms
    action: For which publication or form governs, or whether a message counts as policy, read AR 25-30 Chapter 2.
    sources:
      - AR_25-30 2-1
      - AR_25-30 2-2
      - AR_25-30 2-7
  - step: 7
    name: Knowledge management
    action: For KM questions (sharing products, collaboration sites, KM board), read UR 5-01 Chapter 2 and UR 25-1 Chapter 4.
    sources:
      - UR_5-01 2-2
      - UR_5-01 2-5
      - UR_25-1(V3) 4-2
      - UR_25-1(V3) 4-3
  - step: 8
    name: Return
    action: Return the rule with citations, what the user should do next, and any hand-offs. Note where USAREC regulations are older than the Army regulation they implement.
example_questions:
  - "Can my recruiters use their personal phones to text applicants?"
  - "How long do I have to keep applicant packets for people who never enlisted?"
  - "Is it okay to email a scanned DD 214 to the guidance counselor?"
  - "A recruiter left a printed applicant list in a coffee shop. What do I do now?"
  - "What is the difference between a record and a non-record in our shared drive?"
  - "What does USAREC expect a station to do for knowledge management?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - Never suggest a workaround to a cybersecurity control.
provenance:
  doctrine_root: Station_Commander/Army_Doctrine
  paths: "relative to doctrine_root; 'markdown' is the pre-split .transform text the agent should load at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
