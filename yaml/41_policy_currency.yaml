forms: []
routing_triggers:
  - latest
  - current
  - still in effect
  - still valid
  - new message
  - changed
  - rescinded
  - superseded
  - replaced
  - operational change
  - operational update
  - USAREC message
  - UM
  - OPS flash
  - effective date
  - expired
clarifying_questions:
  - "Which topic, regulation paragraph or message number are you checking?"
  - "Do you need the newest message only, or the full history of changes on the topic?"
hand_off_to:
  "00_orchestrator": "message-versus-paragraph conflicts: return both and let the conflict rule surface them"
  "19_ra_options_incentives": applying an RA incentive message to a specific enlistment
  "20_srip": applying a Reserve incentive message
flow:
  - step: 1
    name: Normalize the query
    action: Turn the request into a message number, a cited paragraph (for example 'AR 601-210 2-18') or topic keywords.
  - step: 2
    name: Search the catalog
    action: Search agent-seeds/_usarec_message_catalog.json by number, by subject words, and by paragraph or chapter cited in the subject. List every hit newest first with status.
    sources: []
  - step: 3
    name: Search the bodies
    action: "Search the message text (USAREC_Messages_Consolidated.md, or the PDF under 'USAREC Messages/') for the same terms and for 'rescind', 'supersede' and 'obsolete'. Rescissions stated only in the body (for example 26-009 rescinding 25-020) are not always in the catalog fields; report them."
    sources: []
  - step: 4
    name: Resolve currency
    action: "For each hit, report: rescinded (and by what), superseded by a newer same-subject message, or no rescission found in the library. Never call a message current; say 'no rescission found in the library'."
    sources: []
  - step: 5
    name: Operational changes
    action: If a message says it changes or replaces a named paragraph or chapter (for example 25-019 making UR 601-210 Chapter 3 obsolete, 26-013 temporarily changing AR 601-210 2-18), return the paragraph reference, the message, its effective language and any duration language, quoted.
    sources: []
  - step: 6
    name: Edition check
    action: "If the message cites AR 601-210 and predates the current AR 601-210 edition, attach the review flag: the regulation may have absorbed or overtaken the change; the user confirms with the guidance counselor or battalion operations."
    sources: []
  - step: 7
    name: Return
    action: "Return a list: message number, subject, date, status, what it changes, and the PDF path. Hand any message-versus-paragraph conflict to the orchestrator without resolving it."
example_questions:
  - "Is message 26-001 on RA incentives still in effect?"
  - "Has anything changed AR 601-210 paragraph 2-18 recently?"
  - "What is the newest message on ECLT testing?"
  - "Is UR 601-210 Chapter 3 still the governing text for recruiter irregularities?"
  - "Which messages have been rescinded in the last year?"
  - "Is there a newer message on DD 368 conditional release approval authority?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - Report status as found in the library ('no rescission found in the library'), never as 'current' or 'in effect'.
  - "The library may be missing messages; always say so when no newer message is found."
  - "Quote effective-date and expiration language exactly; do not compute whether a message has expired."
provenance:
  doctrine_root: Station_Commander/Army_Doctrine
  paths: "relative to doctrine_root; 'markdown' is the pre-split .transform text the agent should load at run time"
  authority_levels: "1 AR 601-210; 2 other AR/DoDI/AD/DA PAM; 3 UR/UM/USAREC messages; 4 guides and training products"
  editions: edition and effective dates read from each document's front matter on 2026-10-05
