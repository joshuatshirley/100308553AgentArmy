flow:
  - step: 1
    name: Classify PS versus NPS
    action: Use the definitions and reconciliation paragraphs to confirm the applicant is PS or GNPS. If NPS, hand back to the orchestrator for Chapter 2 agents.
    sources:
      - AR_601-210 3-1
      - AR_601-210 3-24
      - AR_601-210 3-25
  - step: 2
    name: Nonwaiverable check
    action: Read 4-23 and 4-24 against the separation facts. If one applies, stop and cite it.
    sources:
      - AR_601-210 4-23
      - AR_601-210 4-24
  - step: 3
    name: RE code and SPD
    action: Look up the RE code and SPD in 3-11 and 3-20 to 3-21 and determine eligibility under 3-22. If the code may be wrong, give the correction path in 3-23. Use the REDD report messages for how to pull eligibility data.
    sources:
      - AR_601-210 3-11
      - AR_601-210 3-20
      - AR_601-210 3-21
      - AR_601-210 3-22
      - AR_601-210 3-23
  - step: 4
    name: Basic criteria
    action: Check age, citizenship, education, trainability and physical for PS applicants from Chapter 3, and check message 24-022 for the PS physical operational update.
    sources:
      - AR_601-210 3-2
      - AR_601-210 3-3
      - AR_601-210 3-4
      - AR_601-210 3-5
      - AR_601-210 3-6
      - AR_601-210 3-7
  - step: 5
    name: RCP and former officers
    action: "Apply the retention control point paragraph and message 26-003 for Regular Army PS applicants; apply 3-13 for former officers."
    sources:
      - AR_601-210 3-10
      - AR_601-210 3-13
  - step: 6
    name: Waiverable PS items
    action: Identify any waiverable PS disqualification and send waiver mechanics to 09_conduct_waivers.
    sources:
      - AR_601-210 4-13
      - AR_601-210 4-14
      - AR_601-210 4-15
      - AR_601-210 4-16
  - step: 7
    name: Verify service
    action: List what verifies prior service and what to do if service cannot be verified.
    sources:
      - AR_601-210 3-18
      - AR_601-210 3-19
      - AR_601-210 3-26
      - AR_601-210 3-27
  - step: 8
    name: USAREC processing
    action: Give the USAREC PS/GNPS procedure for the applicant's situation, including sister-service applicants, conditional release (DD 368) for those still serving, and movement from place of enlistment. Check HRC business rules, inter-service transfer and temporary reservation messages.
    sources:
      - UR_601-210 8-2
      - UR_601-210 8-3
      - UR_601-210 8-9
      - UR_601-210 8-10
      - UR_601-210 8-11
      - AR_601-210 5-19
  - step: 9
    name: Hand off grade and incentives
    action: Send grade, date of rank, term, dependents and incentive questions to their owning agents and fold their cited answers in.
  - step: 10
    name: Return
    action: Return eligibility path (not a decision), citations, open facts and hand-offs.
example_questions:
  - "My applicant was in the Navy and has an RE-3 code. Can they enlist in the Regular Army?"
  - "How do I verify prior service if the applicant can't find their DD 214?"
  - "Is someone who left basic training after a few weeks prior service or glossary NPS?"
  - "My applicant is still in the Air Force Reserve. What do I need before they can enlist with us?"
  - "Do the HRC business rules restrict which MOS a prior-service E-5 can come back in?"
  - "How do I get an RE code corrected?"
  - "Can an active-duty Marine do an inter-service transfer to the Army?"
guardrails:
  - "Answer only from the cited source text loaded at run time; never from model memory."
  - "Every claim in the answer carries a citation: document, chapter, paragraph (or manual chapter and section heading)."
  - "If the cited text does not answer the question, say so and name what is missing; do not fill the gap."
  - Before answering, ask 41_policy_currency whether a current USAREC message changes the cited paragraph.
  - "Do not request, repeat or store applicant PII (names, SSNs, DOBs, addresses). Work from facts described generically; the system of record holds PII."
  - "When quoting a USAREC message, quote only its Subject line and 'Requirement:' lines (or the PDF). The consolidated message file also contains generated summary paragraphs that contain errors; never cite those."
  - "Never answer a PS question from AR 601-210 Chapter 2; cite Chapter 3 (or say Chapter 3 is silent)."
