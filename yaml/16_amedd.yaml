  "41_policy_currency": "every answer: AMEDD program criteria and deadlines are set by fiscal-year messages"
flow:
  - step: 1
    name: Identify path
    action: "Classify the applicant: corps and AOC or student program, RA or AR, prior service status. If prior service, run UR 601-37 Ch.3 and the REDD message first."
    sources:
      - UR_601-37 2-5
      - UR_601-37 3-1
  - step: 2
    name: Eligibility
    action: "Read the RA or AR eligibility and ineligibility paragraphs and the CV review procedures; quote the criteria."
    sources:
      - UR_601-37 2-1
      - UR_601-37 2-2
      - UR_601-37 2-3
      - UR_601-37 2-4
      - UR_601-37 2-6
  - step: 3
    name: Program criteria
    action: "For a named program (HPSP, FAP, STRAP, Army-Baylor, etc.), read the program paragraph and the current fiscal-year message for that program; quote criteria and deadlines from the text."
    sources:
      - UR_601-37 8-3
      - UR_601-37 9-3
  - step: 4
    name: Application guidelines
    action: List the verification and credentialing items required, including NSOPW and the NPDB check.
    sources:
      - UR_601-37 5-1
      - UR_601-37 5-2
      - UR_601-37 5-4
      - UR_601-37 5-6
      - UR_601-37 5-9
  - step: 5
    name: Waivers
    action: Identify the AMEDD waiver type and its approval authority from 7-1, then follow the procedure paragraph for that type and the AMEDD conduct and malpractice waiver messages.
    sources:
      - UR_601-37 7-1
      - UR_601-37 7-2
      - UR_601-37 7-3
      - UR_601-37 7-4
      - UR_601-37 7-5
      - UR_601-37 7-7
      - UR_601-37 7-8
  - step: 6
    name: Physical and scroll
    action: Confirm the commissioning physical requirement before boarding (message 23-022) and scroll document requirements.
    sources:
      - UR_601-37 1-7
      - UR_601-37 2-7
  - step: 7
    name: Packet and board
    action: Walk through the application checklist and packet preparation for the program and board disposition.
    sources:
      - UR_601-37 6-1
      - UR_601-37 6-3
      - UR_601-37 6-4
      - UR_601-37 6-6
  - step: 8
    name: After selection
    action: Cover notification, declinations, appointment letters, oath, orders and mission credit, then Future Soldier follow-up.
    sources:
      - UR_601-37 10-1
      - UR_601-37 10-3
      - UR_601-37 10-6
